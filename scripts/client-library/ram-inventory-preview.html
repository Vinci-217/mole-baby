<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'">
<title>原版素材播放</title><style>*{box-sizing:border-box}body{margin:0;font:12px/1.7 system-ui,sans-serif;color:#355b43;background:#faf9f4}header{padding:12px 16px 0}h1{font-size:15px;margin:0}#path{font:10px/1.5 monospace;overflow-wrap:anywhere;color:#7b8574}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:12px 16px}.controls label{display:flex;align-items:center;gap:4px}select,button{border:1px solid #cfd9c9;border-radius:6px;background:white;color:#355b43;padding:5px 7px;font:inherit;max-width:240px}button{cursor:pointer}button:disabled{opacity:.5}#stage{width:100%;height:min(55vh,450px);min-height:280px;background:#eaece2}ruffle-player{display:block;width:100%;height:100%}#status,.note{margin:10px 16px;color:#68766c}#zoom{width:80px}@media(max-width:480px){select{max-width:160px}#stage{height:330px}.controls{gap:6px;padding:10px}}
</style><script src="/ram-official-sweep/2026-11-06/ruffle/ruffle.js"></script></head><body><header><h1 id="name">原版素材</h1><div id="path"></div></header><div class="controls"><label>画面<select id="symbol" aria-label="预览画面"></select></label><label>形态<select id="form" aria-label="成长形态"></select></label><label>方向<select id="direction" aria-label="方向"></select></label><label><input type="checkbox" id="moving" checked>走动</label><button id="pause" disabled>暂停</button><button id="restart" disabled>重新播放</button><label>缩放<input id="zoom" type="range" min="30" max="180" value="100"></label></div><div id="stage"></div><p id="status" role="status">正在加载播放器…</p><p class="note">直接播放所选来源的原 SWF。图层可能只显示局部；依赖账号、配置或完整客户端的模块，建议查看原书页或提取媒体。</p><script>
const $=id=>document.getElementById(id),formNames={level1:'种子',level2:'初级',level3:'中级',level4:'高级',level101:'经典超拉',level101_7:'神力超拉',level5_1:'水系',level5_2:'木系',level5_4:'火系'},directions={down:'正面',leftdown:'左前',left:'左侧',leftup:'左后',up:'背面',rightup:'右后',right:'右侧',rightdown:'右前'};let player,metadata,asset,paused=false,poll;
function option(value,text){const o=document.createElement('option');o.value=value;o.textContent=text;return o}function call(name,...args){try{return player?.ruffle().callExternalInterface(name,...args)}catch{return null}}
function forms(){const selected=$('symbol').value,t=metadata.timelines.find(t=>t.symbol===selected||!selected&&t.sprite===0),values=(t?.labels||[]).map(l=>l.name).filter(s=>s.startsWith('level')&&!(asset.path.includes('/petcloth/')&&s==='level1'));$('form').replaceChildren(...values.map(s=>option(s,formNames[s]||s)));if(!values.length)$('form').append(option('','原始画面'));$('form').disabled=!values.length;$('direction').disabled=$('moving').disabled=!values.length;if(values.includes('level2'))$('form').value='level2'}
function pose(){if(paused){player.ruffle().resume();paused=false;$('pause').textContent='暂停'}call('previewPose',$('form').value,$('direction').value,$('moving').checked)}
function status(){const s=call('previewStatus');if(s?.error){$('status').textContent='该片段需要客户端环境，当前无法独立播放：'+s.error;return}if(s?.ready&&s.settled){$('pause').disabled=$('restart').disabled=false;$('status').textContent=s.width>0?'已加载原时间轴。可暂停、切换画面与实际支持的形态。':'原件已加载。请切换画面；该文件可能只提供内部组件。';window.previewReady=s.width>0}}
(async()=>{try{const query=new URLSearchParams(location.search),response=await fetch('catalog.json');if(!response.ok)throw Error('清单读取失败');asset=(await response.json()).items.find(r=>r.path===query.get('path'));if(!asset||asset.kind!=='swf')throw Error('未找到已保存的 SWF');const variant=asset.variants.find(v=>v.key===query.get('version'))||asset.variants[0];const timeline=await fetch(variant.timeline);if(!timeline.ok)throw Error('时间轴读取失败');metadata=await timeline.json();$('name').textContent=asset.title+' · '+variant.name;$('path').textContent=asset.path;const symbols=metadata.timelines.filter(t=>t.symbol&&t.sprite!==0).sort((a,b)=>b.symbol.includes('lamu_mc')-a.symbol.includes('lamu_mc')||b.labels.length-a.labels.length||b.frames-a.frames);$('symbol').append(option('','原始画面'),...symbols.map(t=>option(t.symbol,t.symbol.split('.').pop())));const main=symbols.find(t=>asset.book?.symbol===t.symbol)||symbols.find(t=>t.symbol.includes('lamu_mc'));if(main)$('symbol').value=main.symbol;forms();for(const[k,v]of Object.entries(directions))$('direction').append(option(k,v));player=window.RufflePlayer.newest().createPlayer();window.player=player;$('stage').append(player);await player.ruffle().load({url:'/ram-official-sweep/2026-11-06/preview-harness.swf',parameters:{source:variant.url,symbol:$('symbol').value,form:$('form').value},autoplay:'on',unmuteOverlay:'hidden',splashScreen:false,allowScriptAccess:true,openUrlMode:'deny',wmode:'transparent',logLevel:'error',preferredRenderer:'canvas'});player.ruffle().volume=0;poll=setInterval(status,350);$('symbol').onchange=()=>{forms();call('previewSymbol',$('symbol').value);pose()};$('form').onchange=$('direction').onchange=$('moving').onchange=pose;$('zoom').oninput=()=>call('previewZoom',Number($('zoom').value)/100);$('pause').onclick=()=>{paused=!paused;player.ruffle()[paused?'suspend':'resume']();$('pause').textContent=paused?'继续':'暂停'};$('restart').onclick=()=>{call('previewSymbol',$('symbol').value);pose()}}catch(error){$('status').textContent='预览未能加载：'+error.message}})();addEventListener('pagehide',()=>{clearInterval(poll);player?.remove()});
</script></body></html>
