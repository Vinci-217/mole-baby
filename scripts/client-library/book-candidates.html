<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>还能加入书架的原版书籍</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f1e7;color:#453b2b;font:15px/1.7 system-ui,'Microsoft YaHei',sans-serif}main{max-width:1220px;margin:auto;padding:40px 28px 70px}h1{font-size:30px;letter-spacing:1px;margin:5px 0 12px}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0}.kicker{font-size:12px;color:#8d704b;letter-spacing:2px}.intro{max-width:850px;color:#756952}.notice{padding:14px 18px;margin:22px 0;background:#fffaf1;border-left:3px solid #b99257}.filters{position:sticky;top:0;z-index:1;background:#f6f1e7f5;padding:14px 0;display:flex;gap:9px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #d8cbb5;margin-bottom:24px}input,select{font:inherit;background:#fffdf7;border:1px solid #cabb9f;border-radius:6px;padding:7px 10px;max-width:100%;color:inherit}input{flex:1;min-width:160px}input[type=checkbox]{flex:none;min-width:0;padding:0;margin:0 7px 0 0;vertical-align:middle}.count{font-size:12px;color:#7d705b}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{padding:18px;background:#fffcf5;border:1px solid #e0d4bf;border-radius:10px;min-width:0;display:flex;flex-direction:column}.cover{width:100%;height:245px;border:0;border-radius:6px;background:#eee4d0;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:10px}.cover:disabled{cursor:default}.cover img{display:block;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(1px 4px 3px #39210b26)}.empty{color:#877455;font-size:13px}.badge{font-size:11px;color:#786945;margin:14px 0 3px}.card[data-group="优先加入"] .badge{color:#50713a}.card h2{font-size:17px;line-height:1.5;margin:0 0 8px}.note{font-size:13px;color:#776c58;flex:1}.pages{font-size:12px;color:#8c7958;margin-top:9px}.card details{margin-top:12px;font-size:11px;color:#938069}.card code{overflow-wrap:anywhere;word-break:break-all;font-size:10px}.duplicate{font-size:11px;color:#8c7958}.pending{padding:4px 8px;border:1px solid #d6c49b;border-radius:5px;background:#f4ebd7}.card a{color:#7d633e}dialog{padding:0;border:0;max-width:none;max-height:none;background:transparent;color:white;overflow:visible}dialog::backdrop{background:#241b15cc}.original{position:relative;line-height:0;outline:0}.original img{display:block;max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 5px 14px #0006)}.hit{position:absolute;bottom:0;width:21%;height:30%;border:0;background:transparent;cursor:pointer;padding:0}.hit:disabled{pointer-events:none}.prev{left:0}.next{right:0}.close{top:0;bottom:auto;right:0;width:20%;height:23%}.hit:focus-visible{outline:2px solid #fff1ae;outline-offset:-3px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}footer{color:#94816a;font-size:12px;margin-top:30px}.load-error{color:#8c3e2d}
@media(max-width:800px){main{padding:24px 14px 40px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:12px}.cover{height:195px}h1{font-size:24px}.card h2{font-size:15px}}
@media(max-width:420px){.grid{grid-template-columns:1fr}.cover{height:250px}.filters{position:relative}.card{padding:18px}}
</style>
<main><div class="kicker">原客户端素材 · 书架候选</div><h1>还可以放进小屋的书</h1><p class="intro">优先看前面五本：它们都与拉姆有关，已核对封面和全部时间轴画面。点击封面查看原画，左右下角翻阅，点书外或按 Escape 合上。</p><div class="notice">这是挑选素材用的目录，候选书尚未加入小屋。画面数包含封面、封底及过渡，不等同于印刷页数；原书中的购买、投稿与账号功能保留为历史画面。</div><div class="filters"><label class="sr" for="q">搜索书名或内容</label><input id="q" type="search" placeholder="搜索书名、内容或源文件"><label class="sr" for="group">筛选</label><select id="group"><option value="">全部候选</option><option>优先加入</option><option>其他可读</option><option>其他书刊</option><option>版本待合并</option><option>需单独适配</option><option>目录入口</option></select><label class="count"><input type="checkbox" id="copies">显示相同原件的其他路径</label><span id="count" class="count" role="status"></span></div><div class="grid" id="grid"><p>正在整理书目…</p></div><footer id="foot"></footer></main>
<dialog id="book" aria-label="查看原书画面"><div class="original"><img alt="" id="page"><button class="hit prev" aria-label="上一页"></button><button class="hit next" aria-label="下一页"></button><button class="hit close" aria-label="合上书本"></button><span id="reading-status" class="sr" role="status" aria-live="polite"></span></div></dialog>
<script>
const $=s=>document.querySelector(s),grid=$('#grid'),dialog=$('#book');let rows=[],current=null,index=0,lastFocus=null;
function element(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node}
const groups=['优先加入','其他可读','其他书刊','版本待合并','需单独适配','目录入口'];
const priority=['resource/besmearBook/other/107.swf','resource/besmearBook/other/2.swf','resource/besmearBook/other/8.swf','resource/besmearBook/other/31.swf','resource/besmearBook/other/224.swf'];
function show(){
 const query=$('#q').value.trim().toLowerCase(),group=$('#group').value,copies=$('#copies').checked;
 const visible=rows.filter(row=>(copies||!row.sameOriginalAs)&&(!group||row.group===group)&&(!query||[row.title,row.path,row.note,...row.texts||[]].join(' ').toLowerCase().includes(query)));
 grid.replaceChildren();$('#count').textContent=`${visible.length} 项`;
 for(const row of visible){
  const card=element('article',undefined,'card');card.dataset.group=row.group;card.dataset.id=row.id;
  const cover=element('button',undefined,'cover');cover.setAttribute('aria-label',`查看《${row.title}》`);
  if(row.samples.length){const img=element('img');img.src=row.samples[0];img.alt=row.title+'原封面或首个画面';img.loading='lazy';cover.append(img);cover.onclick=()=>open(row,cover)}else{cover.disabled=true;cover.append(element('span','需要原脚本组装界面','empty'))}
  card.append(cover,element('div',row.group,'badge'),element('h2',row.title),element('p',row.note,'note'));
  card.append(element('div',row.allFramesVerified?`已核对全部 ${row.frames} 个画面`:`${row.frames} 个时间轴画面 · 展示 ${row.samples.length} 个样张`,'pages'));
  if(row.sameOriginalAs)card.append(element('p','相同原件：'+row.sameOriginalAs,'duplicate'));
  const details=element('details'),summary=element('summary','来源证据');details.append(summary,element('code',row.path),element('p',`sprite ${row.sprite} · 原件 ${(row.bytes/1024).toFixed(0)} KB`),element('code','SHA-256 '+row.sha256));card.append(details);grid.append(card);
 }
 if(!visible.length)grid.append(element('p','没有找到这本书。'));
}
function paint(){const src=current.samples[index];$('#page').src=src;$('#page').alt=current.title+'，原时间轴第 '+(Number(src.split('/').pop().split('.')[0]))+' 个画面';$('.prev').disabled=index===0;$('.next').disabled=index===current.samples.length-1;$('#reading-status').textContent=`${current.title}，第 ${index+1} 个展示画面，共 ${current.samples.length} 个`;}
function open(row,button){current=row;index=0;lastFocus=button;paint();dialog.showModal();$('.next').focus({preventScroll:true})}
function turn(delta){if(!current)return;index=Math.max(0,Math.min(current.samples.length-1,index+delta));paint()}
$('.prev').onclick=()=>turn(-1);$('.next').onclick=()=>turn(1);$('.close').onclick=()=>dialog.close();dialog.onclick=event=>{if(event.target===dialog)dialog.close()};dialog.onclose=()=>lastFocus?.focus({preventScroll:true});document.onkeydown=event=>{if(dialog.open&&(event.key==='ArrowLeft'||event.key==='ArrowRight')){event.preventDefault();turn(event.key==='ArrowLeft'?-1:1)}};
$('#q').oninput=show;$('#group').onchange=show;$('#copies').onchange=show;
(async()=>{const [catalog,assessments]=await Promise.all([fetch('./catalog.json').then(r=>r.json()),fetch('./assessments.json').then(r=>r.json())]);
 rows=catalog.items.map(row=>{const other=assessments[row.path]||{};return {...row,title:row.path.split('/').pop().replace('.swf','')+' · 原书刊',group:'其他书刊',note:'已保存原件并导出代表画面；具体题名见封面，完整页序需接入时进一步核对。',...other,allFramesVerified:row.frames>1&&row.samples.length===row.frames&&row.sampleFrames.length===row.frames}}).sort((a,b)=>groups.indexOf(a.group)-groups.indexOf(b.group)||(priority.indexOf(a.path)<0?99:priority.indexOf(a.path))-(priority.indexOf(b.path)<0?99:priority.indexOf(b.path))||a.title.localeCompare(b.title,'zh-CN'));
 const hashes=new Map();for(const row of rows){row.sameOriginalAs=hashes.get(row.sha256);if(!row.sameOriginalAs)hashes.set(row.sha256,row.path)}
 const unique=hashes.size;$('#foot').textContent=`本次扫描 ${rows.length} 个新增候选路径，按原文件 SHA-256 合并后为 ${unique} 份原件。重复原件、不同版本、书刊目录与读物分别标明。来源均为已保存的固定客户端存档，没有新增下载。`;show();
})().catch(error=>{grid.replaceChildren(element('p','书目暂时没能打开，请刷新后重试。','load-error'));console.error(error)});
</script></html>
