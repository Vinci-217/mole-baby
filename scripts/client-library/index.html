<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拉姆 · 原版素材库</title>
<style>
:root{font:14px/1.6 'Microsoft YaHei','WenQuanYi Zen Hei',sans-serif;color:#59412e;background:#f6f2e9}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a{cursor:pointer}button{border:1px solid #dac6a4;border-radius:8px;background:#fffaf0;color:#6d4a2a;padding:7px 13px}button:hover{background:#f9e6bf}a{color:#9b601e}header{padding:35px max(24px,calc((100vw - 1160px)/2));background:#e7d3ad;border-bottom:1px solid #c9ac7c}h1{font-size:28px;letter-spacing:2px;margin:0}header p{margin:5px 0 0;color:#816748}main{max-width:1208px;margin:auto;padding:24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px 20px;border:1px solid #e2d4ba;border-radius:12px;background:#fffdf7}.stat strong{font-size:24px;display:block;color:#805328}.stat small{color:#977e62}.toolbar{display:flex;gap:10px;margin:22px 0 14px}.toolbar input{flex:1;min-width:0;padding:11px 14px;border:1px solid #cfba98;border-radius:9px;background:#fffef9}.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px}.chips button{white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:18px}.list,.detail,.demo{background:#fffdf8;border:1px solid #e2d4ba;border-radius:13px;overflow:hidden}.list-head,.detail-head{padding:12px 16px;background:#f0e6d1;display:flex;justify-content:space-between;align-items:center}.item{display:block;width:100%;border:0;border-radius:0;border-bottom:1px solid #eee5d4;padding:12px 16px;text-align:left;background:transparent}.item.active{background:#f8e7c3}.item strong{font-size:15px}.path{color:#9c856a;font-size:11px;overflow-wrap:anywhere}.tags{display:flex;gap:6px;margin-top:4px}.tag{padding:1px 7px;border-radius:4px;background:#eee8da;color:#8c704e;font-size:10px}.detail-content{padding:16px;min-height:280px}.detail h3{margin:0 0 8px;overflow-wrap:anywhere}.links{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.timelines{max-height:260px;overflow:auto;border:1px solid #eee2ca;border-radius:8px;padding:8px}.timeline{padding:8px;border-bottom:1px solid #eee4d1}.timeline button{font-size:11px;margin:4px 4px 0 0;padding:3px 8px}.preview{min-height:140px;display:grid;place-items:center;margin-top:14px;background:repeating-conic-gradient(#f3eee4 0% 25%,#fff 0% 50%) 50%/18px 18px;border:1px solid #e4d8c0;border-radius:10px;padding:14px}.preview img{max-width:100%;max-height:340px;object-fit:contain}.note{font-size:11px;color:#9a8268}.exports{max-height:170px;overflow:auto}.exports a{display:block;font-size:11px;overflow-wrap:anywhere;padding:2px 0}.pager{display:flex;justify-content:center;align-items:center;gap:15px;padding:15px}.demo{margin-bottom:20px}.demo summary{padding:13px 17px;cursor:pointer;font-size:16px;font-weight:bold}.demo video{display:block;width:100%;max-height:570px;background:#ede0c4}.demo p{margin:12px 18px}.empty{padding:35px;text-align:center;color:#a08b70}.footer{margin-top:18px;color:#a38c72;font-size:11px}.error{color:#b05235} @media(max-width:880px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}header{padding:24px}main{padding:14px}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:70%}}
</style>
<header><h1>拉姆 · 原版素材库</h1><p>完整原件留在本地，按模块和动作检索。导出结果自动缓存，后续直接复用。</p></header>
<main><section class="stats"><div class="stat"><strong id="files">—</strong><small>已校验原文件</small></div><div class="stat"><strong id="motions">—</strong><small>原始动画时间轴</small></div><div class="stat"><strong id="exports">—</strong><small>脚本与媒体导出进度</small></div><div class="stat"><strong id="checks">—</strong><small>原件完整性</small></div></section>
<details class="demo" id="demo" style="margin-top:20px"><summary>餐厅服务员 · 完整送餐闭环预览</summary><p><button data-movie="restaurant-loop-closeup.mp4">看近景</button> <button data-movie="restaurant-loop.mp4">看完整场景</button></p><video id="demo-video" controls loop muted playsinline src="/demo/restaurant-loop-closeup.mp4"></video><p class="note">角色、服装、餐盘与场景来自原客户端；演示路线和节奏为本地编排。红色服务员造型已与当前官网文件核对。</p></details>
<form class="toolbar" id="search"><input id="query" value="restaurant" placeholder="搜索模块、文件编号、动作或类名，例如 1200042、lamu、GuestBook"><select id="kind"><option value="">全部格式</option><option value="swf">原动画 SWF</option><option value="mp3">音乐 MP3</option><option value="xml">配置 XML</option></select><button>搜索</button></form>
<div class="chips"><button data-query="restaurant">餐厅</button><button data-query="lamu">拉姆</button><button data-query="petcloth">拉姆服装</button><button data-query="GuestBook">留言板</button><button data-query="bgSounds">背景音乐</button><button data-query="root/module/game">小游戏</button><button data-query="root/resource/map">场景</button></div>
<div class="layout"><section class="list"><div class="list-head"><span id="total">正在读取素材索引…</span><small id="page"></small></div><div id="results"></div><div class="pager"><button id="prev">上一页</button><span id="pages"></span><button id="next">下一页</button></div></section><aside class="detail"><div class="detail-head">素材与动作</div><div id="detail" class="detail-content"><p class="note">选择左侧素材查看原文件、已导出媒体、脚本和动作时间轴。</p></div></aside></div>
<p class="footer">来源：<a href="https://github.com/Miigon/RecMoleRes/tree/7a6d6b3c7037a85afb28ad6abd4d7f4adfddb5ff" target="_blank" rel="noreferrer">Miigon/RecMoleRes 原客户端社区存档</a> · 原素材权利归淘米等原权利方。库中保存 SWF 矢量动画；GIF 是按所选片段生成的栅格预览，不能替代客户端的分层和交互逻辑。</p></main>
<script>
const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));let page=0,total=0,selected='',token=0;
const fmt=n=>Number(n||0).toLocaleString('zh-CN'),size=n=>n>1048576?(n/1048576).toFixed(1)+' MB':(n/1024).toFixed(1)+' KB',url=p=>p.split('/').map(encodeURIComponent).join('/');
async function status(){try{const data=await(await fetch('/api/status')).json();$('files').textContent=fmt(data.source.verifiedFiles);$('motions').textContent=fmt(data.index.animatedTimelines);$('exports').textContent=fmt(data.export.exportedSources)+' / '+fmt(data.export.expectedSources);$('checks').textContent=data.source.complete?'全部通过':'正在校验';$('demo').hidden=!data.demo}catch(e){$('checks').textContent='暂时无法读取'}}status();setInterval(status,6000);document.querySelectorAll('[data-movie]').forEach(button=>button.onclick=()=>{$('demo-video').src='/demo/'+button.dataset.movie;$('demo-video').play()});
async function search(){const data=await(await fetch('/api/search?'+new URLSearchParams({q:$('query').value,kind:$('kind').value,page}))).json();total=data.total;$('total').textContent=fmt(total)+' 个素材';$('page').textContent='每页 30 项';$('pages').textContent=(page+1)+' / '+Math.max(1,Math.ceil(total/30));$('prev').disabled=!page;$('next').disabled=(page+1)*30>=total;$('results').innerHTML=data.items.map(item=>`<button class="item ${item.path===selected?'active':''}" data-path="${esc(item.path)}"><strong>${esc(item.path.split('/').pop())}</strong><div class="path">${esc(item.path)}</div><div class="tags"><span class="tag">${esc(item.kind.toUpperCase())}</span><span class="tag">${size(item.bytes)}</span>${item.timelines?`<span class="tag">${item.timelines} 条时间轴</span>`:''}${item.scripts?'<span class="tag">含脚本</span>':''}</div></button>`).join('')||'<div class="empty">没有匹配的素材</div>';document.querySelectorAll('[data-path]').forEach(button=>button.onclick=()=>open(button.dataset.path))}
$('search').onsubmit=e=>{e.preventDefault();page=0;search()};$('prev').onclick=()=>{if(page){page--;search()}};$('next').onclick=()=>{if((page+1)*30<total){page++;search()}};document.querySelectorAll('[data-query]').forEach(button=>button.onclick=()=>{$('query').value=button.dataset.query;page=0;search()});search();
async function open(path){selected=path;token++;const current=token;const data=await(await fetch('/api/asset?'+new URLSearchParams({path}))).json();if(current!==token)return;const item=data.asset,timelines=(data.timeline.timelines||[]).filter(t=>t.frames>1||t.labels.length).sort((a,b)=>Number(b.labels.length>0)-Number(a.labels.length>0)||a.sprite-b.sprite),media=data.exports.filter(e=>/\.(png|jpe?g|gif|mp3|wav)$/i.test(e.name));$('detail').innerHTML=`<h3>${esc(path.split('/').pop())}</h3><div class="path">${esc(path)}</div><div class="links"><a href="/raw/${url(path)}" target="_blank">原文件</a>${data.exportComplete?`<a href="/extracted/${url(path)}/" target="_blank">全部导出文件</a>`:''}${data.timeline.timelines?`<a href="/timelines/${url(path)}.json" target="_blank">时间轴索引</a>`:''}</div><p class="note">${item.fps||'—'} fps · ${size(item.bytes)} · ${data.exportComplete?'脚本和媒体已缓存':'脚本和媒体导出中'}${data.sourceFallback?' · 高级源码使用原指令回退':data.pcodeComplete?' · 已补存原指令':''}</p>${item.kind==='mp3'?`<audio controls style="width:100%" src="/raw/${url(path)}"></audio>`:''}<div class="timelines">${timelines.slice(0,400).map(t=>`<div class="timeline"><span class="path">#${t.sprite} ${esc(t.symbol)} · ${t.frames} 帧</span><div><button data-sprite="${t.sprite}">预览时间轴</button>${t.labels.slice(0,50).map(label=>`<button data-sprite="${t.sprite}" data-frame="${label.frame}">${esc(label.name)}</button>`).join('')}</div></div>`).join('')||'<p class="note">此文件没有独立的多帧时间轴。</p>'}</div><div class="preview" id="preview"><span class="note">点击动作可生成并缓存预览。</span></div><p class="note" id="preview-note">分层片段需结合脚本使用；此处最多预览前 120 帧，完整原动画保留在 SWF 中。</p><details style="margin-top:14px"><summary>已导出媒体与脚本（${data.exports.length}${data.exports.length===200?'+':''}）</summary><div class="exports">${data.exports.map(file=>`<a href="${url(file.url)}" target="_blank">${esc(file.name)}</a>`).join('')||'<p class="note">该文件没有内嵌媒体，或仍在导出。</p>'}</div></details>`;document.querySelectorAll('[data-sprite]').forEach(button=>button.onclick=()=>preview(path,Number(button.dataset.sprite),button.dataset.frame===undefined?null:Number(button.dataset.frame),current));if(media.length){const first=media.find(e=>/\.(png|jpe?g|gif)$/i.test(e.name));if(first)$('preview').innerHTML=`<img src="${url(first.url)}" alt="原始内嵌图片">`}}
async function preview(path,sprite,frame,current){$('preview').innerHTML='<span class="note">正在从本地原时间轴生成预览…</span>';let result=await(await fetch('/api/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path,sprite,frame})})).json();if(result.error){$('preview').textContent=result.error;return}while(result.state==='rendering'){await new Promise(r=>setTimeout(r,800));if(current!==token)return;const next=await(await fetch('/api/job?'+new URLSearchParams({key:result.key}))).json();result={...result,...next}}if(current!==token)return;if(result.state==='ready'){$('preview').innerHTML=`<img src="${result.url}" alt="所选原动作时间轴预览">`;$('preview-note').textContent=result.frames+' 帧'+(result.limited?'（前段预览）':'')+' · '+result.note}else{$('preview').textContent='该片段暂时无法直接渲染。';$('preview-note').textContent=result.note||result.error}}
</script></html>
