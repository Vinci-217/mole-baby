<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拉姆 · 全部新增素材预览</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#563e26;background:#faf5eb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.4}button:focus-visible,a:focus-visible{outline:3px solid #42aabc;outline-offset:3px}main{max-width:1160px;margin:0 auto;padding:38px 24px 24px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.eyebrow{font-size:12px;letter-spacing:2px;color:#ac8454;margin:0 0 8px}h1{font-size:30px;margin:0 0 10px;font-weight:750}header p{font-size:14px;line-height:1.8;color:#8c7458;margin:0}.total{white-space:nowrap;padding:12px 16px;background:#f1e5ce;border-radius:12px;text-align:center;font-size:12px;color:#94744e}.total b{font-size:25px;display:block;color:#674829}.tools{margin-top:26px;display:grid;grid-template-columns:minmax(160px,1fr) auto;gap:10px}.search{position:relative}.search input{width:100%;border:1px solid #ddcdb2;border-radius:10px;background:#fffefa;padding:12px 14px;min-width:0}.tools select{max-width:180px;border:1px solid #ddcdb2;border-radius:10px;background:#fffefa;padding:8px}.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 10px;scrollbar-width:thin}.chips button{flex-shrink:0;border:1px solid #ddcdb2;border-radius:24px;padding:8px 13px;background:#fffefa;font-size:13px}.chips button[aria-pressed=true]{background:#705032;border-color:#705032;color:white}.chips small{margin-left:5px;opacity:.75}.summary{font-size:13px;color:#967b58;margin:8px 0 14px;min-height:20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{border:1px solid #e6d8c1;border-radius:13px;padding:0;background:#fffefa;text-align:left;min-width:0;overflow:hidden;transition:box-shadow .15s}.card:hover{box-shadow:0 5px 20px #74522d15}.picture{height:200px;display:flex;align-items:center;justify-content:center;background:#fffdfa}.picture img{width:184px;height:199px;object-fit:contain;max-width:100%}.caption{padding:12px 13px 14px;border-top:1px solid #f0e7d9}.caption h2{font-size:14px;line-height:1.5;margin:0 0 8px;overflow-wrap:anywhere}.tags{display:flex;gap:5px;flex-wrap:wrap;font-size:10px}.tag{background:#f3ecdf;color:#937b59;padding:3px 6px;border-radius:4px}.tag.new{background:#e6f0de;color:#60824c}.tag.still{background:#e9edf1;color:#77848d}.pages{display:flex;justify-content:center;align-items:center;gap:17px;margin:25px 0}.pages button,.dialog-buttons button,.dialog-buttons a{border:1px solid #ddcdb2;border-radius:8px;background:#fffefa;padding:9px 16px;font-size:13px;text-decoration:none}.pages span{font-size:13px;min-width:80px;text-align:center}.empty{grid-column:1/-1;text-align:center;padding:55px 10px;color:#937b59}footer{font-size:12px;line-height:1.9;color:#a08b70;border-top:1px solid #e8ddc9;padding:18px 0 0}footer p{margin:0 0 6px}footer a{color:#8b6842}dialog{max-width:min(660px,calc(100% - 24px));width:660px;border:1px solid #dccaaa;border-radius:16px;padding:22px;background:#fffdf8;color:#563e26;max-height:92vh;overflow:auto}dialog::backdrop{background:#3327198c}dialog h2{margin:0 45px 5px 0;font-size:20px;overflow-wrap:anywhere}.close{position:absolute;right:14px;top:12px;background:#f1e5ce;border:0;border-radius:50%;width:32px;height:32px;font-size:22px}.dialog-image{width:100%;height:330px;object-fit:contain;display:block;background:#faf5eb;border-radius:10px;margin:15px 0}.dialog-note{font-size:13px;color:#927754;line-height:1.7}.dialog-buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}details{font-size:11px;color:#a08b70;margin-top:18px;overflow-wrap:anywhere}details p{margin:7px 0}details a{color:inherit}.sr-only{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden}@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}main{padding:25px 16px}.picture{height:180px}.picture img{height:178px;width:165px}}@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}main{padding:22px 12px}h1{font-size:23px}.eyebrow{font-size:10px}.total{padding:8px 11px}.total b{font-size:21px}header p{font-size:12px}.tools{grid-template-columns:minmax(0,1fr) 95px;gap:7px}.tools input{font-size:13px}.tools select{font-size:11px;min-width:0;padding:6px}.chips{margin-right:-12px;padding-right:12px}.chips button{font-size:12px;padding:7px 11px}.picture{height:160px}.picture img{height:158px;width:146px}.caption{padding:10px 9px}.caption h2{font-size:12px}.tag{font-size:9px}.dialog-image{height:275px}dialog{padding:18px}.pages{gap:12px}.pages button{padding:8px 12px}}
</style>
<main>
 <header><div><p class="eyebrow">RAMU · ORIGINALS</p><h1>全部新增素材，一项项看</h1><p>110 件新增衣橱装扮，以及互动、课堂、魔法、变身与技能片段。<br>点图片放大查看，每项都有独立 GIF。</p></div><div class="total"><b>567</b>项完整目录</div></header>
 <div class="tools"><label class="search"><span class="sr-only">搜索名称或编号</span><input id="search" placeholder="搜索名称或编号，如：魔法书、1200042" type="search"></label><select id="motion" aria-label="预览类型"><option value="all">全部预览类型</option><option value="moving">有画面变化</option><option value="still">停驻 / 静态</option></select></div>
 <nav class="chips" id="categories" aria-label="动画分类"></nav>
 <p class="summary" id="summary" role="status" aria-live="polite"></p>
 <section class="grid" id="grid" aria-label="全部素材预览"></section>
 <nav class="pages" aria-label="预览翻页"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></nav>
 <footer><p>每项通常截取约 4 秒；短片按原结束信号收尾。装扮依次展示正面、左移和右移。原片停驻与静态画面均如实标注。</p><p>567 项是本轮接入的原版素材清单，含旧装扮原片；其中新增衣橱为 110 件。532 份源文件含多帧，35 份为静态，部分多帧原件在预览形态下会停驻。预览不读取玩家存档，本轮尚未发版。</p><p><a href="./全部预览清单.csv">全部预览清单.csv</a> · <a href="./使用说明.txt">使用说明.txt</a></p></footer>
</main>
<dialog id="viewer" aria-labelledby="detail-title"><button class="close" id="close" aria-label="关闭大图">×</button><h2 id="detail-title"></h2><p class="dialog-note" id="detail-info"></p><img class="dialog-image" id="detail-image" alt=""><p class="dialog-note" id="detail-note"></p><div class="dialog-buttons"><button id="detail-prev">上一项</button><a id="gif-link" target="_blank" rel="noopener">打开 GIF</a><button id="detail-next">下一项</button></div><details><summary>查看原素材信息</summary><p id="detail-source"></p><a id="source-link" target="_blank" rel="noopener">官方素材地址</a></details></dialog>
<script>
'use strict';
const catalog=__CATALOG__;
let category='all',page=0,visible=[],selected=null;const pageSize=12;
const $=id=>document.getElementById(id),grid=$('grid'),dialog=$('viewer');
const options=[['all','全部接入',catalog.rows.length],['new','新增衣橱',catalog.rows.filter(r=>r.newOutfit).length],...Object.entries(catalog.kinds).map(([id,name])=>[id,name,catalog.rows.filter(r=>r.kind===id).length])];
for(const [id,name,count] of options){const button=document.createElement('button');button.dataset.category=id;button.textContent=name+' '+count;button.setAttribute('aria-pressed',String(id===category));button.onclick=()=>{category=id;page=0;render();for(const item of $('categories').children)item.setAttribute('aria-pressed',String(item.dataset.category===id));};$('categories').append(button);}
function tag(text,extra=''){const node=document.createElement('span');node.className='tag '+extra;node.textContent=text;return node;}
function render(){
 const query=$('search').value.trim().toLowerCase(),motion=$('motion').value;
 visible=catalog.rows.filter(row=>(category==='all'||category==='new'&&row.newOutfit||category===row.kind)&&(!query||(row.name+' '+row.source+' '+row.kindName).toLowerCase().includes(query))&&(motion==='all'||motion==='moving'&&row.motion||motion==='still'&&!row.motion));
 const pages=Math.max(1,Math.ceil(visible.length/pageSize));page=Math.min(page,pages-1);grid.replaceChildren();
 for(const row of visible.slice(page*pageSize,(page+1)*pageSize)){
  const card=document.createElement('button');card.className='card';card.dataset.id=row.id;card.setAttribute('aria-label','查看'+row.name+' · '+row.formName);card.onclick=()=>openItem(row.id);
  const picture=document.createElement('div');picture.className='picture';const image=document.createElement('img');image.src=row.gif;image.alt=row.name+'，'+row.formName;image.loading='lazy';image.decoding='async';image.width=240;image.height=260;picture.append(image);
  const caption=document.createElement('div');caption.className='caption';const title=document.createElement('h2');title.textContent=row.name;const tags=document.createElement('div');tags.className='tags';tags.append(tag(row.kindName),tag(row.formName));if(row.newOutfit)tags.append(tag('新增衣橱','new'));if(!row.motion)tags.append(tag('原片停驻 / 静态','still'));caption.append(title,tags);card.append(picture,caption);grid.append(card);
 }
 if(!visible.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='没有找到，试试其他名称、编号或分类。';grid.append(empty);}
 $('summary').textContent='找到 '+visible.length+' 项'+(visible.length?' · 当前第 '+(page*pageSize+1)+'–'+Math.min((page+1)*pageSize,visible.length)+' 项':'');$('page').textContent=(page+1)+' / '+pages;$('prev').disabled=!page;$('next').disabled=page+1>=pages;
}
function openItem(id){
 const row=catalog.rows.find(r=>r.id===id);selected=id;$('detail-title').textContent=row.name;$('detail-image').src=row.gif;$('detail-image').alt=row.name+' · '+row.formName;
 $('detail-info').textContent=row.kindName+' · 录制形态：'+row.formName+(row.newOutfit?' · 新增衣橱':'');$('detail-note').textContent='原件适用：'+row.supported.join('、')+'。'+(!row.motion?'这一项在录制形态下为原片停驻或静态画面。':'本项预览约 '+row.seconds+' 秒。');$('gif-link').href=row.gif;$('detail-source').textContent=row.source;$('source-link').href='https://mole.61.com/'+row.source;
 const index=visible.findIndex(r=>r.id===id);$('detail-prev').disabled=index<=0;$('detail-next').disabled=index<0||index+1>=visible.length;if(!dialog.open)dialog.showModal();
}
function step(delta){const index=visible.findIndex(r=>r.id===selected),row=visible[index+delta];if(row)openItem(row.id);}
$('detail-prev').onclick=()=>step(-1);$('detail-next').onclick=()=>step(1);$('close').onclick=()=>dialog.close();dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.x||event.clientX>r.right||event.clientY<r.y||event.clientY>r.bottom)dialog.close();}});
$('search').addEventListener('input',()=>{page=0;render();});$('motion').addEventListener('change',()=>{page=0;render();});$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};
document.addEventListener('keydown',event=>{if(dialog.open){if(event.key==='ArrowLeft')step(-1);if(event.key==='ArrowRight')step(1);}else if(!['INPUT','SELECT'].includes(document.activeElement.tagName)){if(event.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click();if(event.key==='ArrowRight'&&!$('next').disabled)$('next').click();}});render();
</script>
</html>
