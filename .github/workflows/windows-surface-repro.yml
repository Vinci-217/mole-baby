name: Windows surface reproduction
on:
  push:
    branches: ['preview/windows-surface-play']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-surface-${{ github.ref }}
  cancel-in-progress: true
jobs:
  surface:
    name: Physical desktop ${{ matrix.edition }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: modern
            runner: windows-latest
            platform: windows
            runtime: '37.10.3'
            arch: x64
            directory: release/win-unpacked
            executable: release/win-unpacked/拉姆.exe
          - edition: legacy
            runner: windows-2022
            platform: legacy-x64
            legacy: true
            arch: x64
            directory: release/legacy-x64/win-unpacked
            executable: release/legacy-x64/win-unpacked/拉姆兼容版.exe
          - edition: legacy-ia32
            runner: windows-2022
            platform: legacy-ia32
            legacy: true
            arch: ia32
            directory: release/legacy-ia32/win-ia32-unpacked
            executable: release/legacy-ia32/win-ia32-unpacked/拉姆兼容版.exe
    env:
      ELECTRON_DEV: '0'
      MOLE_LEGACY_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install and build reproduction package
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm ci 2>&1 | tee -a artifacts/surface.log
          npm test 2>&1 | tee -a artifacts/surface.log
          if [ '${{ matrix.legacy }}' = true ]; then
            npm run build:legacy 2>&1 | tee -a artifacts/surface.log
            npx --no-install electron-builder --config electron-builder.legacy.cjs --win --dir --${{ matrix.arch }} --publish never 2>&1 | tee -a artifacts/surface.log
          else
            npm run build 2>&1 | tee -a artifacts/surface.log
            npx --no-install electron-builder --win --dir --x64 --publish never --config.electronVersion='${{ matrix.runtime }}' 2>&1 | tee -a artifacts/surface.log
          fi
      - name: Reproduce on physical desktop over time
        shell: bash
        run: |
          set -o pipefail
          node scripts/windows-surface-repro.cjs '${{ matrix.executable }}' '${{ matrix.edition }}' 2>&1 | tee -a artifacts/surface.log
      - name: Verify packaged interactions and window lifecycle
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-preview-package.cjs '${{ matrix.executable }}' 2>&1 | tee -a artifacts/surface.log
      - name: Include preview instructions
        shell: bash
        run: cp docs/WINDOWS-PREVIEW.txt '${{ matrix.directory }}/预览说明.txt'
      - name: Upload tested Windows preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mole-baby-preview-${{ matrix.platform }}
          path: ${{ matrix.directory }}/
          compression-level: 0
          retention-days: 7
      - name: Upload physical and renderer captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-surface-${{ matrix.edition }}
          path: |
            artifacts/windows-surface-${{ matrix.edition }}/
            artifacts/surface.log
          retention-days: 14
      - name: Save diagnostic over Git
        if: always()
        env:
          CI_DIAGNOSTIC_PLATFORM: ${{ matrix.platform }}
          CI_DIAGNOSTIC_STATUS: ${{ job.status }}
          CI_DIAGNOSTIC_LOG: artifacts/surface.log
          CI_DIAGNOSTIC_MEDIA_DIR: artifacts/windows-surface-${{ matrix.edition }}
        run: node scripts/save-ci-diagnostic.cjs
  mac:
    name: Native Mac regression ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            directory: mac-arm64
          - arch: x64
            runner: macos-15-intel
            directory: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      ELECTRON_DEV: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Build and test native preview application
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm ci 2>&1 | tee -a artifacts/surface.log
          npm test 2>&1 | tee -a artifacts/surface.log
          npm run build 2>&1 | tee -a artifacts/surface.log
          npx --no-install electron-builder --config electron-builder.mac.cjs --mac dir --${{ matrix.arch }} --publish never 2>&1 | tee -a artifacts/surface.log
          node scripts/verify-preview-package.cjs 'release/${{ matrix.directory }}/拉姆.app/Contents/MacOS/拉姆' 2>&1 | tee -a artifacts/surface.log
      - name: Upload native preview diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-mac-${{ matrix.arch }}
          path: |
            artifacts/surface.log
            artifacts/preview-mac-${{ matrix.arch }}.png
          retention-days: 14
      - name: Save native diagnostic over Git
        if: always()
        env:
          CI_DIAGNOSTIC_PLATFORM: mac-${{ matrix.arch }}
          CI_DIAGNOSTIC_STATUS: ${{ job.status }}
          CI_DIAGNOSTIC_LOG: artifacts/surface.log
        run: node scripts/save-ci-diagnostic.cjs
