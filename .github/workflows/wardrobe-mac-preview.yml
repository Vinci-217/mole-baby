name: macOS DMG preview validation

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Short-lived URL for the checked preview app
        type: string
        required: true
      source_sha256:
        description: SHA-256 of the checked preview app
        type: string
        required: true
      destination_url:
        description: Short-lived upload URL for the private DMG
        type: string
        required: true
      version:
        description: Preview application version
        type: string
        required: true

permissions:
  contents: read

jobs:
  preview-dmg:
    if: github.repository == 'Vinci-217/mole-baby' && startsWith(github.ref, 'refs/heads/preview/mac-dmg-')
    runs-on: macos-26
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Sign, mount, launch and verify the Apple silicon DMG
        run: python3 -u .github/scripts/validate-preview-dmg.py
