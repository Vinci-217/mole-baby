name: Desktop build

on:
  push:
    branches: [main, 'release/v0.31.8', 'next/art-direction', 'preview/proportion-polish', 'preview/companion-workflow']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and check Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ELECTRON_DEV: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Check release version
        shell: bash
        run: |
          node -e 'const {version}=require("./package.json"); const ref=process.env.GITHUB_REF; if(ref.startsWith("refs/tags/") && ref !== `refs/tags/v${version}`) throw Error(`Tag ${ref} must match package.json v${version}`); console.log(`Building v${version}`);'

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm ci 2>&1 | tee -a artifacts/windows-smoke.log

      - name: Test game rules
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee -a artifacts/windows-smoke.log

      - name: Build renderer
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a artifacts/windows-smoke.log

      - name: Package installer and portable ZIP
        shell: bash
        run: |
          set -o pipefail
          node scripts/package-windows.cjs 2>&1 | tee -a artifacts/windows-smoke.log
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify packaged assets and start Windows application
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          node scripts/verify-windows-package.cjs 2>&1 | tee -a artifacts/windows-smoke.log

      - name: Verify a confirmed Windows upgrade and saved data
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-windows-update.cjs 2>&1 | tee -a artifacts/windows-smoke.log

      - name: Upload Windows downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mole-baby-Windows-x64
          path: |
            release/mole-baby-*.zip
            release/mole-baby-*-Setup.exe
            release/SHA256SUMS.txt
            release/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload Windows smoke screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Windows-smoke-screenshot
          path: |
            artifacts/windows-smoke.png
            artifacts/windows-smoke.log
            artifacts/windows-update-fixture.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Save platform diagnostic before other platforms finish
        if: always() && (github.ref == 'refs/heads/release/v0.31.8' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/preview/proportion-polish' || github.ref == 'refs/heads/preview/companion-workflow')
        continue-on-error: true
        env:
          CI_DIAGNOSTIC_PLATFORM: windows
          CI_DIAGNOSTIC_STATUS: ${{ job.status }}
          CI_DIAGNOSTIC_LOG: artifacts/windows-smoke.log
        run: node scripts/save-ci-diagnostic.cjs

  legacy:
    name: Build and check legacy Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      ELECTRON_DEV: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MOLE_LEGACY_ARCH: ${{ matrix.arch }}
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up build Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        shell: bash
        run: |
          node -e 'const {version}=require("./package.json"); if(process.env.GITHUB_REF.startsWith("refs/tags/") && process.env.GITHUB_REF !== `refs/tags/v${version}`) throw Error("Tag/version mismatch");'
      - name: Install build dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm ci 2>&1 | tee -a artifacts/legacy-${{ matrix.arch }}-smoke.log
      - name: Test shared application and compatibility contracts
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee -a artifacts/legacy-${{ matrix.arch }}-smoke.log
      - name: Build shared renderer
        shell: bash
        run: |
          set -o pipefail
          npm run build:legacy 2>&1 | tee -a artifacts/legacy-${{ matrix.arch }}-smoke.log
      - name: Package isolated Electron 22 installer and portable ZIP
        shell: bash
        run: |
          set -o pipefail
          node scripts/package-windows.cjs --legacy --arch ${{ matrix.arch }} 2>&1 | tee -a artifacts/legacy-${{ matrix.arch }}-smoke.log
      - name: Verify PE architecture, ZIP payload, installer and application
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-windows-package.cjs --legacy --arch ${{ matrix.arch }} --directory release/legacy-${{ matrix.arch }} 2>&1 | tee -a artifacts/legacy-${{ matrix.arch }}-smoke.log
      - name: Upload checked legacy downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mole-baby-legacy-${{ matrix.arch }}
          path: |
            release/legacy-${{ matrix.arch }}/mole-baby-*-legacy-${{ matrix.arch }}.zip
            release/legacy-${{ matrix.arch }}/mole-baby-*-legacy-${{ matrix.arch }}-Setup.exe
            release/legacy-${{ matrix.arch }}/SHA256SUMS-legacy-${{ matrix.arch }}.txt
            release/legacy-${{ matrix.arch }}/legacy-${{ matrix.arch }}.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload legacy runtime diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legacy-smoke-${{ matrix.arch }}
          path: |
            artifacts/legacy-${{ matrix.arch }}-smoke.log
            artifacts/windows-legacy-${{ matrix.arch }}-smoke.png
            artifacts/windows-installer-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Save platform diagnostic before other platforms finish
        if: always() && (github.ref == 'refs/heads/release/v0.31.8' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/preview/proportion-polish' || github.ref == 'refs/heads/preview/companion-workflow')
        continue-on-error: true
        env:
          CI_DIAGNOSTIC_PLATFORM: legacy-${{ matrix.arch }}
          CI_DIAGNOSTIC_STATUS: ${{ job.status }}
          CI_DIAGNOSTIC_LOG: artifacts/legacy-${{ matrix.arch }}-smoke.log
        run: node scripts/save-ci-diagnostic.cjs

  mac:
    name: Build and check macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ELECTRON_DEV: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Configure Mac signing and notarization
        id: mac_signing
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          node scripts/configure-mac-signing.cjs 2>&1 | tee -a artifacts/mac-${{ matrix.arch }}-smoke.log
      - name: Check release version and native architecture
        run: |
          node -e 'const {version}=require("./package.json"); if(process.arch !== "${{ matrix.arch }}") throw Error("Runner architecture mismatch"); if(process.env.GITHUB_REF.startsWith("refs/tags/") && process.env.GITHUB_REF !== `refs/tags/v${version}`) throw Error("Tag/version mismatch");'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee -a artifacts/mac-${{ matrix.arch }}-smoke.log
      - name: Test game and platform rules
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee -a artifacts/mac-${{ matrix.arch }}-smoke.log
      - name: Build renderer
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a artifacts/mac-${{ matrix.arch }}-smoke.log
      - name: Package native DMG and ZIP (${{ steps.mac_signing.outputs.mode }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.mac_signing.outputs.mode == 'notarized' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -o pipefail
          npx --no-install electron-builder --config electron-builder.mac.cjs --mac dmg zip --${{ matrix.arch }} --publish never 2>&1 | tee -a artifacts/mac-${{ matrix.arch }}-smoke.log
          node scripts/notarize-mac-dmg.cjs ${{ matrix.arch }} 2>&1 | tee -a artifacts/mac-${{ matrix.arch }}-smoke.log
      - name: Verify disk image, signature and actual Mac application
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          node scripts/verify-mac-package.cjs ${{ matrix.arch }} 2>&1 | tee -a artifacts/mac-${{ matrix.arch }}-smoke.log
          cp release/latest-mac.yml release/latest-mac-${{ matrix.arch }}.yml
      - name: Upload checked Mac downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mole-baby-mac-${{ matrix.arch }}
          path: |
            release/mole-baby-*-mac-${{ matrix.arch }}.dmg
            release/mole-baby-*-mac-${{ matrix.arch }}.zip
            release/SHA256SUMS-mac-${{ matrix.arch }}.txt
            release/macos-trust-${{ matrix.arch }}.json
            release/latest-mac-${{ matrix.arch }}.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload Mac verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-smoke-${{ matrix.arch }}
          path: |
            artifacts/mac-${{ matrix.arch }}-smoke.png
            artifacts/mac-${{ matrix.arch }}-smoke.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Save platform diagnostic before other platforms finish
        if: always() && (github.ref == 'refs/heads/release/v0.31.8' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/preview/proportion-polish' || github.ref == 'refs/heads/preview/companion-workflow')
        continue-on-error: true
        env:
          CI_DIAGNOSTIC_PLATFORM: mac-${{ matrix.arch }}
          CI_DIAGNOSTIC_STATUS: ${{ job.status }}
          CI_DIAGNOSTIC_LOG: artifacts/mac-${{ matrix.arch }}-smoke.log
        run: node scripts/save-ci-diagnostic.cjs

  android:
    name: Build and verify fixed-signed Android preview
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release/v0.31.8'
    uses: ./.github/workflows/android-preview.yml
    permissions:
      contents: write
    secrets: inherit

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, legacy, mac, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out tagged release notes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install metadata verifier
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Download checked Windows and Mac packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mole-baby-*
          merge-multiple: true
          path: release

      - name: Check artifact checksums
        working-directory: release
        run: |
          cat SHA256SUMS.txt SHA256SUMS-legacy-x64.txt SHA256SUMS-legacy-ia32.txt SHA256SUMS-mac-arm64.txt SHA256SUMS-mac-x64.txt > combined.sha256
          mv combined.sha256 SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          node ../scripts/prepare-update-blockmaps.cjs
          node ../scripts/prepare-release-notes.cjs
          node ../scripts/update-metadata.cjs
          sha256sum --check SHA256SUMS.txt
          sha256sum --check SHA256SUMS-android.txt

      - name: Create release or replace its build attachments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # Every native job, including the fixed-signed Android install and
          # upgrade, has passed before either public channel becomes visible.
          if gh release view android-preview >/dev/null 2>&1; then
            gh release upload android-preview release/*.apk release/resources-*.zip release/resources-*.json release/resources-*.blockmap release/*.apk.blockmap release/SHA256SUMS-android.txt --clobber
          else
            gh release create android-preview release/*.apk release/resources-*.zip release/resources-*.json release/resources-*.blockmap release/*.apk.blockmap release/SHA256SUMS-android.txt --target "$GITHUB_SHA" --prerelease --latest=false --title "安卓固定签名预览版" --notes "Android 8+，WebView 108+。固定签名，支持后续覆盖升级；APK 安装仍需用户确认。"
          fi
          gh release upload android-preview release/latest-android.json --clobber
          gh release edit android-preview --prerelease --latest=false
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.dmg release/mole-baby-*.zip release/*-Setup.exe release/*.blockmap release/SHA256SUMS.txt release/macos-trust-*.json release/mole-baby-mac-help.html release/latest.yml release/legacy-x64.yml release/legacy-ia32.yml release/latest-mac.yml --clobber
            gh release edit "$RELEASE_TAG" --notes-file release/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" release/*.dmg release/mole-baby-*.zip release/*-Setup.exe release/*.blockmap release/SHA256SUMS.txt release/macos-trust-*.json release/mole-baby-mac-help.html release/latest.yml release/legacy-x64.yml release/legacy-ia32.yml release/latest-mac.yml --draft --verify-tag --title "拉姆 $RELEASE_TAG" --notes-file release/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release/*.apk release/*.apk.blockmap release/SHA256SUMS-android.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file release/RELEASE_NOTES.md

  report:
    name: Save build receipt
    if: always() && (github.ref == 'refs/heads/release/v0.31.8' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview/proportion-polish' || github.ref == 'refs/heads/preview/companion-workflow')
    needs: [build, legacy, mac, android, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source for the receipt branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download checked platform artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mole-baby-*
          merge-multiple: true
          path: ${{ runner.temp }}/ramu-downloads

      - name: Download platform verification diagnostics
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*smoke*'
          merge-multiple: true
          path: ${{ runner.temp }}/ramu-smoke

      - name: Record the build result over Git
        if: always()
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          MAC_RESULT: ${{ needs.mac.result }}
          LEGACY_RESULT: ${{ needs.legacy.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const env = process.env;
          const downloadsDir = path.join(env.RUNNER_TEMP, 'ramu-downloads');
          const sumsFiles = fs.existsSync(downloadsDir) ? fs.readdirSync(downloadsDir).filter(name => /^SHA256SUMS(?:-mac-(?:arm64|x64)|-legacy-(?:ia32|x64))?\.txt$/.test(name)).sort() : [];
          const downloads = sumsFiles.flatMap(name => fs.readFileSync(path.join(downloadsDir,name), 'utf8').trim().split('\n')).filter(Boolean).map(line => {
            const match = line.match(/^([a-f0-9]{64})  (mole-baby-[^/\\]+\.(?:zip|exe|dmg))$/);
            if (!match) throw new Error('Invalid build checksum entry');
            return { file: match[2], sha256: match[1] };
          });
          const allBuilt = [env.BUILD_RESULT, env.LEGACY_RESULT, env.MAC_RESULT].every(value => value === 'success');
          if (allBuilt && (downloads.length !== 10 || new Set(downloads.map(d => d.file)).size !== 10)) throw new Error('Expected ten unique checked modern/legacy Windows and Mac downloads');
          const logPath = path.join(env.RUNNER_TEMP, 'ramu-smoke', 'windows-smoke.log');
          const verificationLog = fs.existsSync(logPath) ? fs.readFileSync(logPath, 'utf8').slice(-12000) : null;
          const receipt = {
            version: require('./package.json').version,
            tag: env.GITHUB_REF_NAME,
            sourceSha: env.GITHUB_SHA,
            buildResult: allBuilt ? 'success' : 'failure',
            platforms: { windows: env.BUILD_RESULT, legacyWindows: env.LEGACY_RESULT, mac: env.MAC_RESULT },
            androidResult: env.ANDROID_RESULT,
            releaseResult: env.RELEASE_RESULT,
            runUrl: `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`,
            releaseUrl: env.RELEASE_RESULT === 'success' ? `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/releases/tag/${encodeURIComponent(env.GITHUB_REF_NAME)}` : null,
            downloads,
            verificationLog,
            legacyVerificationLogs: Object.fromEntries(['x64','ia32'].map(arch => {
              const file = path.join(env.RUNNER_TEMP,'ramu-smoke',`legacy-${arch}-smoke.log`);
              return [arch, fs.existsSync(file) ? fs.readFileSync(file,'utf8').slice(-16000) : null];
            })),
            macTrust: Object.fromEntries(['arm64','x64'].map(arch => {
              const file = path.join(downloadsDir,`macos-trust-${arch}.json`);
              return [arch, fs.existsSync(file) ? JSON.parse(fs.readFileSync(file,'utf8')) : null];
            })),
            macVerificationLogs: Object.fromEntries(['arm64','x64'].map(arch => {
              const file = path.join(env.RUNNER_TEMP,'ramu-smoke',`mac-${arch}-smoke.log`);
              return [arch, fs.existsSync(file) ? fs.readFileSync(file,'utf8').slice(-12000) : null];
            })),
            recordedAt: new Date().toISOString(),
          };
          fs.writeFileSync(path.join(env.RUNNER_TEMP, 'ramu-build-receipt.json'), `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin refs/heads/build-reports >/dev/null; then
            git fetch --depth=1 origin refs/heads/build-reports
            git checkout -B build-reports FETCH_HEAD
          else
            git checkout --orphan build-reports
            git rm -rf .
          fi
          for attempt in 1 2 3; do
            mkdir -p reports
            cp "$RUNNER_TEMP/ramu-build-receipt.json" "reports/$GITHUB_SHA.json"
            git add -- "reports/$GITHUB_SHA.json"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Windows build $GITHUB_RUN_ID ($BUILD_RESULT)"
            if git push origin HEAD:refs/heads/build-reports; then exit 0; fi
            git fetch --depth=1 origin refs/heads/build-reports
            git reset --hard FETCH_HEAD
          done
          exit 1
