name: Android preview (no release)
on:
  push:
    branches: ['preview/android-mobile']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MOLE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_STORE_PASSWORD }}
      MOLE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEY_PASSWORD }}
      MOLE_ANDROID_KEY_ALIAS: ${{ vars.ANDROID_PREVIEW_KEY_ALIAS || 'mole-preview' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the complete offline game and resource blockmap
        run: |
          npm ci
          npm test
          npm run build
          node scripts/android/prepare-assets.cjs
          echo "ANDROID_PREVIEW_CODE=$((320000 + GITHUB_RUN_NUMBER * 10))" >> "$GITHUB_ENV"
      - name: Phone and tablet browser interactions
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node scripts/android/browser-smoke.cjs
      - name: Build and unit test Android
        working-directory: android
        run: |
          ./gradlew assembleDebug testDebugUnitTest lintDebug -PmoleVersion="0.32.0-preview.${GITHUB_RUN_NUMBER}" -PmoleVersionCode="$ANDROID_PREVIEW_CODE" --no-daemon
          mkdir -p ../mobile-release
          cp app/build/outputs/apk/debug/app-debug.apk ../mobile-release/mole-baby-android-preview-dev.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 WebView, overlay and actual APK upgrade
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          heap-size: 512M
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android/emulator-smoke.sh
      - name: Load optional fixed preview signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PREVIEW_KEYSTORE_BASE64" ] && [ -n "$MOLE_ANDROID_STORE_PASSWORD" ]; then
            python3 - <<'PY'
          import os,base64,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'ramu-preview.p12'
          p.write_bytes(base64.b64decode(os.environ['PREVIEW_KEYSTORE_BASE64'],validate=True))
          p.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('MOLE_ANDROID_KEYSTORE='+str(p)+'\n')
          PY
          else
            echo 'No fixed preview signing key configured; the development APK is available for review.'
          fi
      - name: Prepare fixed-signed update artifacts without publishing
        if: env.MOLE_ANDROID_KEYSTORE != ''
        run: |
          cd android
          ./gradlew assembleRelease -PmoleVersion="0.32.0-preview.${GITHUB_RUN_NUMBER}" -PmoleVersionCode="$ANDROID_PREVIEW_CODE" --no-daemon
          cd ..
          node scripts/android/prepare-update.cjs
      - name: Save APK, screenshots and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-preview-${{ github.run_number }}
          path: |
            mobile-release/
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/androidTest-results/
            artifacts/android/
          retention-days: 14
          compression-level: 0
