name: Android preview (no release)
on:
  push:
    branches: ['preview/android-mobile']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      MOLE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_STORE_PASSWORD }}
      MOLE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEY_PASSWORD }}
      MOLE_ANDROID_KEY_ALIAS: ${{ vars.ANDROID_PREVIEW_KEY_ALIAS || 'mole-preview' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Build the complete offline game and resource blockmap
        run: |
          set -o pipefail
          mkdir -p mobile-release
          npm ci 2>&1 | tee mobile-release/dependencies.log
          npm test 2>&1 | tee mobile-release/renderer-tests.log
          npm run build 2>&1 | tee mobile-release/renderer-build.log
          node scripts/android/prepare-assets.cjs 2>&1 | tee mobile-release/resource-pack.log
          echo "ANDROID_PREVIEW_CODE=$((320000 + GITHUB_RUN_NUMBER * 10))" >> "$GITHUB_ENV"
      - name: Phone and tablet browser interactions
        id: mobile-browser
        continue-on-error: true
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          set -o pipefail
          node scripts/android/browser-smoke.cjs 2>&1 | tee mobile-release/browser-tests.log
      - name: Build and unit test Android
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest lintDebug -PmoleVersion="0.32.0-preview.${GITHUB_RUN_NUMBER}" -PmoleVersionCode="$ANDROID_PREVIEW_CODE" --no-daemon --stacktrace 2>&1 | tee ../mobile-release/android-build.log
          mkdir -p ../mobile-release
          cp app/build/outputs/apk/debug/app-debug.apk ../mobile-release/mole-baby-android-preview-dev.apk
          cp -R app/build/test-results/testDebugUnitTest ../mobile-release/unit-tests
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 WebView, overlay and actual APK upgrade
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          heap-size: 512M
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -o pipefail -c 'bash scripts/android/emulator-smoke.sh 2>&1 | tee mobile-release/emulator.log'
      - name: Require successful browser verification
        if: always()
        run: test '${{ steps.mobile-browser.outcome }}' = success
      - name: Load optional fixed preview signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PREVIEW_KEYSTORE_BASE64" ] && [ -n "$MOLE_ANDROID_STORE_PASSWORD" ]; then
            python3 - <<'PY'
          import os,base64,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'ramu-preview.p12'
          p.write_bytes(base64.b64decode(os.environ['PREVIEW_KEYSTORE_BASE64'],validate=True))
          p.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('MOLE_ANDROID_KEYSTORE='+str(p)+'\n')
          PY
          else
            echo 'No fixed preview signing key configured; the development APK is available for review.'
          fi
      - name: Prepare fixed-signed update artifacts without publishing
        if: env.MOLE_ANDROID_KEYSTORE != ''
        run: |
          cd android
          ./gradlew assembleRelease -PmoleVersion="0.32.0-preview.${GITHUB_RUN_NUMBER}" -PmoleVersionCode="$ANDROID_PREVIEW_CODE" --no-daemon
          cd ..
          node scripts/android/prepare-update.cjs --fetch-previous
      - name: Save APK, screenshots and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-preview-${{ github.run_number }}
          path: |
            mobile-release/
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/androidTest-results/
            artifacts/android/
          retention-days: 14
          compression-level: 0
      - name: Save native verification over Git
        if: always()
        env:
          CI_DIAGNOSTIC_PLATFORM: android
          CI_DIAGNOSTIC_STATUS: ${{ job.status }}
          CI_DIAGNOSTIC_LOG: mobile-release/android-verification.log
          CI_DIAGNOSTIC_MEDIA_DIR: mobile-release
        run: |
          mkdir -p mobile-release
          node - <<'NODE'
          const fs=require('node:fs');
          const files=['dependencies.log','renderer-tests.log','renderer-build.log','resource-pack.log','browser-tests.log','android-build.log','emulator.log','native-smoke-test.txt','android-ui-state.txt','actual-apk-delta.json','apk-upgrade-test.txt'];
          fs.writeFileSync('mobile-release/android-verification.log',files.filter(f=>fs.existsSync('mobile-release/'+f)).map(f=>f+'\n'+fs.readFileSync('mobile-release/'+f,'utf8').slice(-5000)).join('\n'));
          NODE
          node scripts/save-ci-diagnostic.cjs
